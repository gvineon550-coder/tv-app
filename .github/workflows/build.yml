name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9
          cache-disabled: false

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/build
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Unit Tests (если есть)
        run: ./gradlew testDebugUnitTest --stacktrace || echo "No tests yet"

      - name: Lint
        run: ./gradlew lintDebug --stacktrace || echo "Lint warnings ignored"

      - name: Build Debug APK
        run: >
          ./gradlew assembleDebug
          -PappVersionCode=${{ github.run_number }}
          -PappVersionName=1.0.${{ github.run_number }}
          --stacktrace

      - name: Build Release APK (проверка сборки)
        run: >
          ./gradlew assembleRelease
          -PappVersionCode=${{ github.run_number }}
          -PappVersionName=1.0.${{ github.run_number }}
          --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p apk-out
          cp app/build/outputs/apk/debug/app-debug.apk \
             apk-out/TV-1.0.${{ github.run_number }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-1.0.${{ github.run_number }}
          path: apk-out/TV-1.0.${{ github.run_number }}.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TV 1.0.${{ github.run_number }}
          body: |
            Автоматическая сборка.
            Версия: 1.0.${{ github.run_number }}
            Коммит: ${{ github.sha }}
          files: apk-out/TV-1.0.${{ github.run_number }}.apk
